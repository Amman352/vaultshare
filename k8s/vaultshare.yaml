apiVersion: v1
kind: Namespace
metadata:
  name: vaultshare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultshare
  namespace: vaultshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultshare
  template:
    metadata:
      labels:
        app: vaultshare
    spec:
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USER/vaultshare:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: vaultshare-config
                  key: database-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vaultshare-config
                  key: database-username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultshare-config
                  key: database-password
            - name: STORAGE_MODE
              value: s3
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: vaultshare-config
                  key: s3-bucket
            - name: JAVA_TOOL_OPTIONS
              value: -Xmx512m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 700Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vaultshare
  namespace: vaultshare
spec:
  type: NodePort
  selector:
    app: vaultshare
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vaultshare
  namespace: vaultshare
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaultshare
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
