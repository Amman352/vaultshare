<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VaultShare · Admin</title>
<style>
body{margin:0;background:#f5f7f8;color:#1c3040;font:16px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#101e2d;color:white;padding:32px max(24px,calc((100vw - 850px)/2))}header h1{margin:0;font-size:32px}header p{color:#b3c4cf}
main{max-width:850px;margin:32px auto;padding:0 24px}.card{background:white;border:1px solid #e1e9ed;border-radius:18px;padding:28px;box-shadow:0 14px 36px #18344b0b}
label{display:block;margin:16px 0 6px;font-weight:700}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #b7cbd1;border-radius:9px;font:inherit}
button{background:#159b8d;color:white;border:0;border-radius:9px;padding:11px 17px;margin-top:16px;font:inherit;font-weight:700;cursor:pointer}
button.remove{background:#fff;color:#a23838;border:1px solid #e4c5c5;margin:0 0 0 12px;padding:7px 11px}
li{padding:12px 0;border-bottom:1px solid #e9eff1}#message{white-space:pre-wrap;color:#167d70}
</style>
</head>
<body>
<header><h1>VaultShare admin</h1><p>Allow or remove a client EC2 public IPv4 address for file listing and downloads.</p></header>
<main><div class="card">
<label for="username">Admin username</label><input id="username" value="admin" autocomplete="username">
<label for="password">Admin password</label><input id="password" type="password" autocomplete="current-password">
<button id="load">Sign in and load clients</button>
<label for="ip">Client public IPv4 address</label><input id="ip" inputmode="decimal" placeholder="203.0.113.10">
<button id="allow">Allow downloads</button>
<p id="message" role="status"></p><h2>Allowed clients</h2><ul id="clients"></ul>
</div></main>
<script>
const username=document.querySelector('#username'),password=document.querySelector('#password'),message=document.querySelector('#message'),list=document.querySelector('#clients');
function auth(){return 'Basic '+btoa(username.value+':'+password.value)}
async function request(path,options={}){const response=await fetch('/api/admin/clients'+path,{...options,headers:{Authorization:auth(),'Content-Type':'application/json',...options.headers}});if(!response.ok)throw Error(response.status===401?'Incorrect admin credentials':await response.text());return response}
async function load(){try{const ips=await (await request('')).json();list.replaceChildren();for(const ip of ips){const item=document.createElement('li');item.append(document.createTextNode(ip));const button=document.createElement('button');button.className='remove';button.textContent='Remove';button.onclick=async()=>{try{await request('/'+encodeURIComponent(ip),{method:'DELETE'});message.textContent='Removed '+ip;await load()}catch(error){message.textContent=error.message}};item.append(button);list.append(item)}message.textContent=ips.length?'Client list loaded':'No client IPs allowed yet'}catch(error){message.textContent=error.message}}
document.querySelector('#load').onclick=load;
document.querySelector('#allow').onclick=async()=>{try{const ip=document.querySelector('#ip').value.trim();await request('',{method:'POST',body:JSON.stringify({ip})});message.textContent='Allowed '+ip;await load()}catch(error){message.textContent=error.message}};
</script>
</body></html>
