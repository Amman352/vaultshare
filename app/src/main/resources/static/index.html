<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaultShare</title>
<style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;color:#182233}button,input{font:inherit;padding:.5rem;margin:.25rem}button{cursor:pointer}section{padding:1rem;border:1px solid #ccd3db;border-radius:8px;margin:1rem 0}li{margin:.7rem 0}#message{white-space:pre-wrap;color:#874000}#upload-progress{display:block;width:100%;height:1.25rem;margin:.75rem 0}#upload-progress[hidden]{display:none}#upload-status{margin:.25rem 0;color:#284b75}</style>
<h1>VaultShare</h1><p>File sharing with expiring links</p>
<section><h2>Files</h2><input id="file" type="file"><button id="upload">Upload</button><button id="refresh">Refresh</button><progress id="upload-progress" max="100" value="0" aria-label="Upload progress" hidden></progress><p id="upload-status" role="status" aria-live="polite"></p><ul id="files"></ul></section><p id="message"></p>
<script>
const msg=t=>document.querySelector('#message').textContent=t;
async function api(path,options={}){const r=await fetch('/api'+path,options);if(!r.ok)throw Error((await r.text())||r.status);return r}
function uploadFile(file,progress,status){return new Promise((resolve,reject)=>{const body=new FormData();body.append('file',file);const xhr=new XMLHttpRequest();xhr.open('POST','/api/files');xhr.upload.onprogress=event=>{if(event.lengthComputable){const percent=Math.min(100,Math.round(event.loaded/event.total*100));progress.value=percent;status.textContent=percent===100?'Upload sent. Saving file…':`Uploading: ${percent}%`}else{progress.removeAttribute('value');status.textContent='Uploading…'}};xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve():reject(Error(xhr.responseText||`Upload failed (${xhr.status})`));xhr.onerror=()=>reject(Error('Upload failed. Check your connection.'));xhr.send(body)})}
document.querySelector('#upload').onclick=async()=>{const button=document.querySelector('#upload');const progress=document.querySelector('#upload-progress');const status=document.querySelector('#upload-status');try{const f=document.querySelector('#file').files[0];if(!f)throw Error('Choose a file');button.disabled=true;progress.hidden=false;progress.value=0;status.textContent='Starting upload…';await uploadFile(f,progress,status);progress.value=100;status.textContent='Upload complete';msg('Uploaded');await refresh()}catch(e){status.textContent='Upload failed';msg(e.message)}finally{button.disabled=false}};
document.querySelector('#refresh').onclick=refresh;
async function refresh(){try{const r=await api('/files');const data=await r.json();const list=document.querySelector('#files');list.replaceChildren();for(const f of data){const li=document.createElement('li');li.append(document.createTextNode(`${f.filename} (${f.sizeBytes} bytes) `));for(const [label,action] of [['Download',()=>download(f.id,f.filename)],['Share',()=>share(f.id)],['Delete',()=>remove(f.id)]]){const b=document.createElement('button');b.textContent=label;b.onclick=action;li.append(b)}list.append(li)}}catch(e){msg(e.message)}}
async function download(id,name){try{const r=await api('/files/'+id);const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){msg(e.message)}}
async function share(id){try{const r=await api('/files/'+id+'/shares',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hours:1,maxDownloads:1})});const data=await r.json();msg('One-hour, one-download link: '+location.origin+data.path)}catch(e){msg(e.message)}}
async function remove(id){try{await api('/files/'+id,{method:'DELETE'});msg('Deleted');refresh()}catch(e){msg(e.message)}}
refresh();
</script></html>
